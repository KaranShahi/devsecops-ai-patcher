# Copy to config.ini and fill in. config.ini is git-ignored (it holds secrets).

[telegram]
# Get these at https://my.telegram.org -> API development tools
api_id = 1234567
api_hash = your_api_hash_here
# Channel/group usernames (without @) or numeric IDs, comma separated
channels = my_gold_signals

[mt5]
# Leave login blank to use whatever account the MT5 terminal is already logged into
login =
password =
server =
# Your broker's gold symbol - often XAUUSD, but may be XAUUSD.m, GOLD, XAUUSDm, etc.
symbol = XAUUSD

[trading]
# SAFETY: stays true until you set it false. In dry-run, signals are parsed and logged only.
dry_run = true
# Refuse to trade a REAL-money account unless this is true
allow_live_account = false

# Position sizing: "risk" = risk_percent of balance per signal, "fixed" = fixed_lots per signal
lot_mode = risk
risk_percent = 1.0
fixed_lots = 0.01
max_lots_per_signal = 0.50

# --- Layering (entry zone) ---
# Zone signals (e.g. SELL 3622-3631) are split into layers spaced `layer_spacing` dollars apart
# (3.5 = 35 pips on gold), at most `max_layers`. TOTAL risk (risk_percent / fixed_lots) is divided
# across the layers, so layering never increases your planned risk. Layers price has already
# passed are skipped, not chased.
max_layers = 3
layer_spacing = 3.5
# Skip the signal if price is more than this many dollars outside the zone
max_entry_distance = 40

# --- Profit management at TP1 ---
# full    = close everything at TP1
# partial = close tp1_close_percent at TP1, move SL of the rest to breakeven
# none    = do nothing at TP1 (positions run to hold_tp / SL)
tp1_action = partial
tp1_close_percent = 50
# Breakeven SL = entry +/- this many dollars (covers spread/commission)
breakeven_buffer = 0.30
# TP the remaining positions aim for (1-5; 0 = last TP in the signal)
hold_tp = 2
# Obey short messages like "close your worst entry"
follow_manager_commands = true

# Market order if signal entry is within this many dollars of current price; otherwise pending order
market_tolerance = 0.50
# Skip signal if the spread is wider than this (in points)
max_spread_points = 60
# Max slippage on market orders (in points)
deviation_points = 30
# Max open positions + pending orders from this tool
max_open_trades = 8
# Ignore signals older than this many seconds (e.g. after a reconnect)
max_signal_age_seconds = 120
# Pending orders expire after this many minutes (0 = good till cancelled)
pending_expiry_minutes = 120
magic_number = 20260101
